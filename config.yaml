# ============================================
# MODELO PADRÃO PARA AUTOCOMPLETE
# ============================================
tabAutocompleteModel:
  name: Groq AutoComplete
  provider: groq
  model: llama-3.1-8b-instant
  apiKey: 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
  completionOptions:
    maxTokens: 150
    temperature: 0.2
# ============================================
# CONTEXTO
# ============================================
context:
  - provider: code
    params:
      path: ./
      ignore:
        - node_modules
        - .git
        - dist
        - build
        - venv
        - __pycache__
        - .next
        - out
        - .env
  - provider: problems
    params:
      severity: error
      maxProblems: 10
  - provider: terminal
    params:
      maxLines: 50
# ============================================
# COMANDOS RÁPIDOS (SLASH COMMANDS)
# ============================================
slashCommands:
  - name: test
    description: Gerar testes
    params:
      model: Groq Llama 3.3 70B
      instruction: "Gere testes unitários para este código"
  - name: explain
    description: Explicar código
    params:
      model: Gemini 2.0 Flash
      instruction: "Explique este código de forma clara e objetiva"
  - name: quick
    description: Resposta rápida
    params:
      model: Groq Llama 3.1 8B
      instruction: "Responda de forma concisa e direta"
  - name: refactor
    description: Refatorar código
    params:
      model: GitHub GPT-4o Mini
      instruction: "Refatore este código melhorando legibilidade e performance"
  - name: review
    description: Revisar código
    params:
      model: Gemini 2.0 Flash
      instruction: "Revise este código identificando bugs e melhorias"
  - name: openrouter
    description: Usar OpenRouter
    params:
      model: OpenRouter Llama 4 Maverick Free
      instruction: "Ajude com esta tarefa"
  - name: huggingface
    description: Usar Hugging Face
    params:
      model: HuggingFace Mistral 7B
      instruction: "Ajude com esta tarefa"
  - name: github
